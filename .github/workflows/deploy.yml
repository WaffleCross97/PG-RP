name: Build 1.21.11 Resource Pack

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        # Added quotes here to handle the space in the name
        working-directory: './Waffle Music'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pack Zip
        run: |
          # Zips your files from inside the 'Waffle Music' folder
          zip -r ../pack.zip assets/ pack.mcmeta pack.png

      - name: Generate 1.21.11 Hash
        id: hash
        working-directory: . 
        run: |
          # Moves back to the main folder to save the zip and hash
          SHA=$(sha1sum pack.zip | awk '{ print $1 }')
          echo $SHA > hash.txt
          echo "pack_sha=$SHA" >> $GITHUB_OUTPUT

      - name: Push to Repo
        working-directory: .
        run: |
          git config --global user.name "PackBot"
          git config --global user.email "bot@github.com"
          git add pack.zip hash.txt
          git commit -m "Update 1.21.11 Pack: ${{ steps.hash.outputs.pack_sha }}"
          git push
