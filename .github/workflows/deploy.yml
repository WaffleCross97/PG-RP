name: Build Java and Bedrock Packs

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Create the Java Zip from the Disc folder
      - name: Create Java Zip
        run: zip -r ../pack.zip assets/ pack.mcmeta pack.png
        working-directory: ./Waffle_Music_Disc

      # 2. Create the Bedrock .mcpack from the Bedrock folder
      - name: Create Bedrock Pack
        run: zip -r ../bedrock-pack.mcpack manifest.json pack_icon.png textures/ sounds/ texts/
        working-directory: ./Waffle_Music_Disc_Bedrock

      # 3. Generate Hash and Push both to GitHub
      - name: Push to Repo
        run: |
          sha1sum pack.zip | awk '{ print $1 }' > hash.txt
          git config --global user.name "PackBot"
          git config --global user.email "bot@github.com"
          git add pack.zip bedrock-pack.mcpack hash.txt
          git commit -m "Update Java & Bedrock: $(date)"
          git push
