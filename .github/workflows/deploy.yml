name: Build and Deploy Packs

on:
  push:
    branches: [ main ]
    # Only run when files relevant to the PACKS change, not on every commit
    paths:
      - 'Waffle_Music_Disc/**'
      - 'Waffle_Music_Disc_Bedrock/**'
      # Add other paths containing your model source files
      - 'assets/minecraft/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Create the Java Zip
      - name: Create Java Zip
        run: zip -r ../pack.zip assets/ pack.mcmeta pack.png
        working-directory: ./Waffle_Music_Disc

      # 2. Create the Bedrock .mcpack
      - name: Create Bedrock Pack
        run: zip -r ../Waffle_Music.mcpack manifest.json pack_icon.png textures/ sounds/ texts/
        working-directory: ./Waffle_Music_Disc_Bedrock

      # 3. Generate Hash and Push both to GitHub
      - name: Push to Repo
        run: |
          sha1sum pack.zip | awk '{ print $1 }' > hash.txt
          git config --global user.name "PackBot"
          git config --global user.email "bot@github.com"
          git add pack.zip Waffle_Music.mcpack hash.txt
          git commit -m "Update packs: $(date)"
          git push

  # REMOVE the 'deploy-pages' job entirely
  # It's not needed because your HTML site is static
  # and doesn't change when packs are updated